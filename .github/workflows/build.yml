name: Modern Core Smoke Build

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  linux-noop:
    name: Build modern core (headless/no-op)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Check XDK backend sources (source-level, not an XDK build)
        run: python3 tools/xdk/check_xdk_sources.py

      - name: Test XDK renderer transform math (host, not an XDK build)
        run: |
          gcc -std=c99 -Wall -Wextra -Isrc tools/xdk/test_d3d9_transform.c -lm -o test_d3d9_transform
          ./test_d3d9_transform

      - name: Configure
        run: >
          cmake -S . -B build
          -DPLATFORM=cli
          -DBACKEND=noop
          -DAUDIO_BACKEND=none
          -DIMAGE_DECODER=stb
          -DVIDEO_BACKEND=none
          -DENABLE_PHYSICS=OFF
          -DENABLE_FILE_PICKER=OFF
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Check command-line entry point
        run: ./build/butterscotch --help
